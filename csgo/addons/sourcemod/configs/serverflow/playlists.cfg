"ServerFlowPlaylists"
{
    // Декларативный слой playlist-метаданных.
    //
    // Важные термины:
    // - `playlist_id` (в scenarios.cfg) -> ссылка сценария на секцию плейлиста ниже.
    // - `maplist_policy` (в scenarios.cfg) определяет source of truth для map pool:
    //    * `playlist` -> source of truth: playlists.cfg (`maplist_file` внутри плейлиста).
    //    * `scenario` -> source of truth: scenarios.cfg (`maplist_file` самого сценария).
    //
    // Практика: для `maplist_policy=playlist` maplist_file в сценарии считается запасным
    // fallback-источником, а основной map pool берётся по `playlist_id` из этого файла.

    "dz"
    {
        "maplist_file"   "cfg/maplist_dz.txt"
        "rotation_mode"  "sequential"
    }

    "comp"
    {
        "maplist_file"   "cfg/maplist_comp.txt"
        "rotation_mode"  "sequential"
    }

    "casual"
    {
        "maplist_file"   "cfg/maplist_casual.txt"
        "rotation_mode"  "sequential"
    }
}
